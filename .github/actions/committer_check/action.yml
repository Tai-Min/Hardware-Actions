# Check if committer of the last commit in a PR is associated with the repo
name: Committer association check

inputs:
  repo:
    required: true
    type: string
  pr_number:
    required: true
    type: string
  repo_token:
    required: true
    type: string
outputs:
  association:
    description: true if user is a collaborator in repo, false otherwise
    value: ${{ steps.user_check.outputs.association }}

runs:
  using: "composite"
  steps:
    - name: Check if the PR head committer is a collaborator
      id: user_check
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPO_TOKEN: ${{ inputs.repo_token }}
      run: |
        set -euo pipefail
        headers=(-H "Authorization: Bearer $REPO_TOKEN" -H "Accept: application/vnd.github+json")
        head_sha=$(curl --fail --silent --show-error --location \
          "${headers[@]}" \
          "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | jq -er '.head.sha')

        committer_login=$(curl --fail --silent --show-error --location \
          "${headers[@]}" \
          "https://api.github.com/repos/$REPO/commits/$head_sha" | jq -r '.committer.login // empty')

        collaborator=false
        if [[ -n "$committer_login" ]]; then
          status=$(curl --silent --show-error --location -o /dev/null -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/$REPO/collaborators/$committer_login")
          if [[ "$status" == "204" ]]; then
            collaborator=true
          fi
        fi

        if [[ "$collaborator" == "true" ]]; then
          echo "$committer_login is an allowed collaborator"
          echo "association=true" >> "$GITHUB_OUTPUT"
        else
          echo "The PR head committer is not an allowed collaborator"
          echo "association=false" >> "$GITHUB_OUTPUT"
        fi
