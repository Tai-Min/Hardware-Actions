# Label PRs based on rules in labeler.yml
name: PR Labeler

on:
  workflow_call:

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Get labeler
        run: |
          wget https://raw.githubusercontent.com/Tai-Min/Hardware-Actions/refs/heads/master/helpers/labeler.yml
      - name: Add labels to a topic
        uses: actions/labeler@v6
        with:
          configuration-path: ./labeler.yml