name: Create hardware release
on:
  workflow_call:
    inputs:
      name:
        description: Name of the hardware release
        required: true
        type: string
      sha:
        description: Commit sha
        required: true
        type: string
      projects:
        description: Comma separated project names
        required: true
        type: string

jobs:
  release_creator:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get issue templates
        if: always()
        run: |
          wget https://raw.githubusercontent.com/Tai-Min/Hardware-Actions/refs/heads/master/helpers/ISSUE_HW_RELEASE_SUCCESS.md
          wget https://raw.githubusercontent.com/Tai-Min/Hardware-Actions/refs/heads/master/helpers/ISSUE_HW_RELEASE_FAIL.md

      - name: Install requirements
        run: |
          wget https://raw.githubusercontent.com/Tai-Min/Hardware-Actions/refs/heads/master/helpers/board2pdf.config.ini

          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt update
          # Might fail in the future
          sudo apt install kicad kicad-libraries kicad-symbols kicad-footprints --no-install-recommends
          mkdir -p ~/.config/kicad/9.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/9.0/sym-lib-table
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/9.0/fp-lib-table

          python -m pip install PyMuPDF==1.24.13
          python -m pip install --upgrade pdfCropMargins
          git clone https://gitlab.com/dennevi/Board2Pdf --branch v1.9.x

          git clone https://github.com/bennymeg/Fabrication-Toolkit.git

      - name: Create release files
        env:
          PROJECTS: ${{ inputs.projects }}
        run: |
          if [[ ! "$PROJECTS" =~ ^[[:space:]]*[A-Za-z0-9][A-Za-z0-9_-]*([[:space:]]*,[[:space:]]*[A-Za-z0-9][A-Za-z0-9_-]*)*[[:space:]]*$ ]]; then
            echo "Invalid projects input: use comma-separated project names containing only letters, digits, underscores, or hyphens." >&2
            exit 1
          fi

          IFS=',' read -r -a PROJECT_LIST <<< "$PROJECTS"
          HW_PATH="./hw"

          mkdir release

          for PROJECT in "${PROJECT_LIST[@]}"; do
            PROJECT="${PROJECT//[[:space:]]/}"
            echo "$PROJECT"
            mkdir "$HW_PATH/$PROJECT/report"
            mkdir "$HW_PATH/$PROJECT/plots"

            # Run twice to ignore CvPcb warning on a fresh install
            kicad-cli sch erc "$HW_PATH/$PROJECT/$PROJECT.kicad_sch" --output "$HW_PATH/$PROJECT/report/erc.rpt"
            kicad-cli sch erc "$HW_PATH/$PROJECT/$PROJECT.kicad_sch" --output "$HW_PATH/$PROJECT/report/erc.rpt"

            kicad-cli sch export pdf "$HW_PATH/$PROJECT/$PROJECT.kicad_sch" --output "$HW_PATH/$PROJECT/plots/${PROJECT}_sch.pdf"

            kicad-cli pcb drc "$HW_PATH/$PROJECT/$PROJECT.kicad_pcb" --output "$HW_PATH/$PROJECT/report/drc.rpt" --schematic-parity

            python3 ./Board2Pdf/src/board2pdf/cli.py "$HW_PATH/$PROJECT/$PROJECT.kicad_pcb" --colorize pymupdf --ini "./board2pdf.config.ini"

            (cd Fabrication-Toolkit && python3 -m plugins.cli -p "../$HW_PATH/$PROJECT/$PROJECT.kicad_pcb" --noBackup --nonInteractive)

            cp -r "$HW_PATH/$PROJECT/" release
          done

          find release -name '*.svg' -type f -delete

      - uses: actions/upload-artifact@v4
        id: artifact
        if: success()
        with:
          name: hardware
          path: ./release
          if-no-files-found: error

      - uses: JasonEtco/create-an-issue@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ inputs.name }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
          URL: ${{steps.artifact.outputs.artifact-url}}
        with:
          filename: ./ISSUE_HW_RELEASE_SUCCESS.md
          assignees: ${{ github.actor }}

      - uses: JasonEtco/create-an-issue@v2
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ inputs.name }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        with:
          filename: ./ISSUE_HW_RELEASE_FAIL.md
          assignees: ${{ github.actor }}
