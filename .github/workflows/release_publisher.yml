name: Create a release draft

on:
  workflow_call:
    inputs:
      comment_id:
        required: true
        type: number
      comment_body:
        required: true
        type: string
      issue_number:
        required: true
        type: number
      is_pull_request:
        required: true
        type: boolean

jobs:
  check_author:
    runs-on: ubuntu-22.04
    if: >
      inputs.is_pull_request == false &&
      (inputs.comment_body == '/release' || startsWith(inputs.comment_body, '/release '))
    permissions:
      issues: read
    outputs:
      association: ${{ steps.author_check.outputs.association }}
    steps:
      - name: Get author of the comment
        id: author_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTHOR_ASSOCIATION=$(gh api repos/${{ github.repository }}/issues/comments/${{ inputs.comment_id }} | jq .author_association)
          echo "association=$AUTHOR_ASSOCIATION" >> $GITHUB_OUTPUT

  release_publisher:
    if: needs.check_author.outputs.association == '"OWNER"' || needs.check_author.outputs.association == '"COLLABORATOR"'
    runs-on: ubuntu-22.04
    needs: check_author
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Get release description
        id: release_body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # TODO: get issue comment from inputs

          BODY="$(gh api repos/${{ github.repository }}/issues/comments/${{ inputs.comment_id }} | jq -r .body)"
          BODY="${BODY#/release}"
          BODY="${BODY# }"
          DELIMITER="$(cat /proc/sys/kernel/random/uuid)"
          while [[ "$BODY" == *"$DELIMITER"* ]]; do
            DELIMITER="$(cat /proc/sys/kernel/random/uuid)"
          done
          {
            printf 'body<<%s\n' "$DELIMITER"
            printf '%s\n' "$BODY"
            printf '%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Get author comment variables
        id: author_comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          #TODO: get issue from inputs
          COMMENT=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }} | jq .body)
          NAME=$(echo "$COMMENT" | grep -oP '(?<=<!-- name:)[^ ]+(?= -->)')
          SHA=$(echo "$COMMENT" | grep -oP '(?<=<!-- sha:)[^ ]+(?= -->)')
          RUN_ID=$(echo "$COMMENT" | grep -oP '(?<=<!-- run_id:)[^ ]+(?= -->)')
          URL=$(echo "$COMMENT" | grep -oP '(?<=<!-- url:)[^ ]+(?= -->)')
          ARTIFACT_URL=$(echo "$COMMENT" | grep -oP '(?<=<!-- artifact_url:)[^ ]+(?= -->)')

          echo "$NAME"
          echo "$SHA"
          echo "$RUN_ID"
          echo "$URL"
          echo "$ARTIFACT_URL"

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v5
        id: download_artifacts
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.author_comment.outputs.run_id }}
          path: ./release

      - name: Create Release
        id: create_release
        uses: comnoco/create-release-action@v2.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.author_comment.outputs.name }}
          release_name: ${{ steps.author_comment.outputs.name }}
          body: ${{ steps.release_body.outputs.body }}
          draft: true
          prerelease: true
          commitish: ${{ steps.author_comment.outputs.sha }}
      
      - name: Zip release
        run: |
          cd ${{ steps.download_artifacts.outputs.download-path }}
          zip -r release.zip .

      - name: Upload Release Asset
        id: upload_release_asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.download_artifacts.outputs.download-path }}/release.zip
          asset_name: release.zip
          asset_content_type: application/zip

      - name: Post comment with results
        uses: actions/github-script@v7
        env:
          RELEASE_NAME: ${{ steps.author_comment.outputs.name }}
          RELEASE_URL: ${{ steps.create_release.outputs.html_url }}
        with:
          script: |
            const releaseName = process.env.RELEASE_NAME;
            const releaseUrl = process.env.RELEASE_URL;
            const body = `Release created: [${releaseName}](${releaseUrl})`;
            await github.rest.issues.createComment({
              issue_number: ${{ inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
