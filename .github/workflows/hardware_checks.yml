name: Hardware checks

on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      repo_name:
        required: true
        type: string
    outputs:
      comment:
        description: Comment from job or empty if the job was skipped
        value: ${{ jobs.hardware_checks.outputs.comment }}
      skipped:
        description: true if skipped, empty otherwise
        value: ${{ jobs.handle_skipped.outputs.skipped }}

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      schematics: ${{ steps.filter.outputs.schematics }}
      schematics_files: ${{ steps.filter.outputs.schematics_files }}
      pcb: ${{ steps.filter.outputs.pcb }}
      pcb_files: ${{ steps.filter.outputs.pcb_files }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          repository: ${{ inputs.repo_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check if schematics or pcbs were changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json
          filters: |
            schematics:
              - added|modified: '**/*.kicad_sch'
            pcb:
              - added|modified: '**/*.kicad_pcb'

      - name: Echo schematics
        if: steps.filter.outputs.schematics == 'false'
        run: echo "No schematics to check"

      - name: Echo PCB
        if: steps.filter.outputs.pcb == 'false'
        run: echo "No PCB to check"

  hardware_checks:
    needs: filter
    if: needs.filter.outputs.schematics == 'true' || needs.filter.outputs.pcb == 'true'

    runs-on: ubuntu-22.04
    env:
      AUTO_BRANCH: ${{ inputs.head_ref }}-PR${{ inputs.pr_number }}-AUTO
    permissions:
      pull-requests: write
      contents: write
    outputs:
      comment: ${{ steps.comment.outputs.comment }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          repository: ${{ inputs.repo_name }}
          fetch-depth: 0
          persist-credentials: false
          
      - name: Install KiCad
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt update
          # Might fail in the future
          sudo apt install kicad kicad-libraries kicad-symbols kicad-footprints --no-install-recommends
          mkdir -p ~/.config/kicad/9.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/9.0/sym-lib-table
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/9.0/fp-lib-table
          #cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/9.0/sym-lib-table

          mkdir -p ./results

      - name: Committer check
        id: committer_check
        uses: Tai-Min/Hardware-Actions/.github/actions/committer_check@master
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check schematics
        id: check_schematics
        if: needs.filter.outputs.schematics == 'true'
        env:
          SCHEMATICS_FILES_JSON: ${{ needs.filter.outputs.schematics_files }}
          COMMITTER_ASSOCIATION: ${{ steps.committer_check.outputs.association }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p erc
          mkdir -p schematics

          mapfile -d '' -t FILES < <(jq -j '.[] | ., "\u0000"' <<< "$SCHEMATICS_FILES_JSON")
          printf '%s\n' "${FILES[@]}"
          if (( ${#FILES[@]} == 0 )); then
            echo "No schematic files were returned by the filter" >&2
            exit 1
          fi

          # Ignore CvPcb warning on fresh install
          FIRST_FILE="${FILES[0]}"
          echo "$FIRST_FILE"
          kicad-cli sch erc "$FIRST_FILE" --output "./result.rpt"

          RESULT=""
          for FILE in "${FILES[@]}"; do
            # Ignore hierarchical schematics
            LAST_DIR="$(basename "$(dirname "$FILE")")"
            FILENAME="$(basename "$FILE")"
            FILE_NAME_NO_EXT="${FILENAME%.*}"
            if [ "$LAST_DIR" != "$FILE_NAME_NO_EXT" ]; then
              continue
            fi

            mkdir -p "./erc/$(dirname "$FILE")"
            OUT=$(kicad-cli sch erc "$FILE" --output "./erc/$FILE.rpt")
            OUT=$(echo "$OUT" | head -n 1)

            REPORT=""
            if [[ "$COMMITTER_ASSOCIATION" == 'true' ]]; then
              REPORT="[report](https://github.com/${{ github.repository }}/blob/$AUTO_BRANCH/erc/$FILE.rpt)"
            else
              REPORT="Report not available"
            fi

            RESULT+=$'\n- '"${FILE}: $REPORT"$'\n'"$OUT"

            kicad-cli sch export svg "$FILE" --output "./schematics"
          done

          printf '%s\n' "$RESULT"

          DELIMITER="$(uuidgen)"
          {
            echo "result<<$DELIMITER"
            printf '%s\n' "$RESULT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$RESULT" > ./results/erc.txt

          SCHEMATICS=""
          mapfile -d '' -t SCHEMATIC_IMAGES < <(find ./schematics -maxdepth 1 -type f -printf '%f\0')
          for IMAGE in "${SCHEMATIC_IMAGES[@]}"; do
            SCHEMATICS+=$'\n- '"$IMAGE"
            SCHEMATICS+=$'\n![KiCad schematic](https://github.com/'"$BASE_REPOSITORY/raw/$AUTO_BRANCH/schematics/$IMAGE)"
          done

          printf '%s\n' "$SCHEMATICS"

          DELIMITER="$(uuidgen)"
          {
            echo "schematics<<$DELIMITER"
            printf '%s\n' "$SCHEMATICS"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          exit 0

      - name: Check PCB
        id: check_pcb
        if: needs.filter.outputs.pcb == 'true'
        env:
          PCB_FILES_JSON: ${{ needs.filter.outputs.pcb_files }}
          COMMITTER_ASSOCIATION: ${{ steps.committer_check.outputs.association }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p drc
          mkdir -p pcb

          mapfile -d '' -t FILES < <(jq -j '.[] | ., "\u0000"' <<< "$PCB_FILES_JSON")
          printf '%s\n' "${FILES[@]}"
          if (( ${#FILES[@]} == 0 )); then
            echo "No PCB files were returned by the filter" >&2
            exit 1
          fi

          python -m pip install PyMuPDF==1.24.13
          python -m pip install --upgrade pdfCropMargins
          git clone https://gitlab.com/dennevi/Board2Pdf --branch v1.9.x

          RESULT=""
          PCB=""
          for FILE in "${FILES[@]}"; do
            echo "$FILE"
            mkdir -p "./drc/$(dirname "$FILE")"
            OUT=$(kicad-cli pcb drc "$FILE" --output "./drc/$FILE.rpt" --schematic-parity)
            OUT=$(echo "$OUT" | head -n 3)

            REPORT=""
            if [[ "$COMMITTER_ASSOCIATION" == 'true' ]]; then
              REPORT="[report](https://github.com/${{ github.repository }}/blob/$AUTO_BRANCH/drc/$FILE.rpt)"
            else
              REPORT="Report not available"
            fi

            RESULT+=$'\n- '"${FILE}: $REPORT"$'\n'"$OUT"

            wget https://raw.githubusercontent.com/Tai-Min/Hardware-Actions/refs/heads/master/helpers/board2pdf.config.ini
            python3 ./Board2Pdf/src/board2pdf/cli.py "$FILE" --colorize pymupdf --ini ./board2pdf.config.ini

            PCB_DIR=$(dirname "$FILE")
            mkdir -p "./pcb/$PCB_DIR"
            mv "$PCB_DIR/plots" "./pcb/$PCB_DIR/"

            for SVG in "./pcb/$PCB_DIR"/plots/*.svg; do
              # Add white background
              sed -i '0,/<\/defs>/{s/<\/defs>/<\/defs><rect width="100%" height="100%" fill="white"\/>/}' "$SVG"

              PCB+=$'\n- '"$SVG"
              PCB+=$'\n![KiCad PCB](https://github.com/'"$BASE_REPOSITORY/raw/$AUTO_BRANCH/$SVG)"
            done
          done

          rm -r Board2Pdf

          printf '%s\n' "$RESULT"

          DELIMITER="$(uuidgen)"
          {
            echo "result<<$DELIMITER"
            printf '%s\n' "$RESULT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$RESULT" > ./results/drc.txt

          printf '%s\n' "$PCB"

          DELIMITER="$(uuidgen)"
          {
            echo "pcb<<$DELIMITER"
            printf '%s\n' "$PCB"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload hardware checks
        uses: actions/upload-artifact@v4
        with:
          name: hardware_checks-PR${{ inputs.pr_number }}
          overwrite: 'true'
          path: |
            erc/
            schematics/
            drc/
            pcb/
            results/

      - name: Push reports to git
        if: steps.committer_check.outputs.association == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          git remote set-url origin "https://github.com/$BASE_REPOSITORY.git"
          git config --global user.email "bot@bots.robobus"
          git config --global user.name "BOT"
          for directory in erc schematics drc pcb results; do
            if [[ -d "$directory" ]]; then
              git add -A -- "$directory"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "AUTO: Update reports" -s
          fi
          git push origin "HEAD:refs/heads/$AUTO_BRANCH" --force

      - name: Create markdown for results comment
        id: comment
        env:
          COMMITTER_ASSOCIATION: ${{ steps.committer_check.outputs.association }}
          SCHEMATICS_RESULT: ${{ steps.check_schematics.outputs.result }}
          SCHEMATICS_IMAGES: ${{ steps.check_schematics.outputs.schematics }}
          PCB_RESULT: ${{ steps.check_pcb.outputs.result }}
          PCB_IMAGES: ${{ steps.check_pcb.outputs.pcb }}
        run: |
          COMMENT=""
          if [[ "$COMMITTER_ASSOCIATION" == 'true' ]]; then
            if [[ -n "$SCHEMATICS_RESULT" ]]; then
              COMMENT="### Schematics ERC results:"
              COMMENT+=$'\n'"$SCHEMATICS_RESULT"
            fi

            if [[ -n "$SCHEMATICS_IMAGES" ]]; then
              COMMENT+=$'\n### Schematics:'
              COMMENT+=$'\n'"$SCHEMATICS_IMAGES"
            fi

            if [[ -n "$PCB_RESULT" ]]; then
              COMMENT+=$'\n### PCB DRC results:'
              COMMENT+=$'\n'"$PCB_RESULT"
            fi

            if [[ -n "$PCB_IMAGES" ]]; then
              COMMENT+=$'\n### PCB:'
              COMMENT+=$'\n'"$PCB_IMAGES"
            fi
          else
            if [[ -n "$SCHEMATICS_RESULT" ]]; then
              COMMENT="### Schematics ERC results:"
              COMMENT+=$'\n'"$SCHEMATICS_RESULT"
            fi

            if [[ -n "$PCB_RESULT" ]]; then
              COMMENT+=$'\n### PCB DRC results:'
              COMMENT+=$'\n'"$PCB_RESULT"$'\n'
            fi
          fi

          DELIMITER="$(uuidgen)"
          {
            echo "comment<<$DELIMITER"
            printf '%s\n' "$COMMENT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  handle_skipped:
    needs: filter
    if: needs.filter.outputs.schematics == 'false' && needs.filter.outputs.pcb == 'false'
    uses: ./.github/workflows/handle_skipped.yml
