name: PR rule enforcer

on:
  workflow_call:

jobs:
  # Head branch must start with predefinied prefix
  check_head_branch_name:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check head branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == repo/*  || 
                "$BRANCH_NAME" == docs/*  || 
                "$BRANCH_NAME" == bug/*   ||
                "$BRANCH_NAME" == devel/* ||
                "$BRANCH_NAME" == feature/* ]]; then
            echo "✅ $BRANCH_NAME is allowed to be merged into master"
          else
            echo "❌ $BRANCH_NAME it not allowed to be merged into master"
            exit 1
          fi

      - name: Post comment if head name is not a valid one
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ⚠️ Branch name must follow contribution guidelines. Check README for details.
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Commits must be signed
  check_signoff:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{github.event.pull_request.head.repo.full_name}}
          fetch-depth: 0

      - name: Check commit sign-offs
        id: check
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git remote add original "https://github.com/${BASE_REPOSITORY}.git"
          git fetch original "refs/heads/${BASE_REF}"
          COMMITS=$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
          echo "Base ref: $BASE_REF ($BASE_SHA)"
          echo "$COMMITS"
          UNSIGNED='[]'
          for COMMIT in $COMMITS; do
            if ! git show -s --format=%B "$COMMIT" | git interpret-trailers --parse | grep -Eq '^Signed-off-by: .+ <[^<>]+>$'; then
              AUTHOR=$(git show -s --format=%an "$COMMIT")
              UNSIGNED=$(jq -cn --argjson commits "$UNSIGNED" --arg commit "$COMMIT" --arg author "$AUTHOR" '$commits + [{commit: $commit, author: $author}]')
            fi
          done
          if [ "$UNSIGNED" != '[]' ]; then
            echo "❌ Found unsigned commits:"
            echo "$UNSIGNED"
            echo "unsigned=$UNSIGNED" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ All commits are signed off."
          fi

      - name: Post comment if unsigned commits found
        if: failure() && steps.check.outputs.unsigned != ''
        uses: actions/github-script@v7
        env:
          UNSIGNED_COMMITS: ${{ steps.check.outputs.unsigned }}
        with:
          script: |
            const commits = JSON.parse(process.env.UNSIGNED_COMMITS || "[]");
            const details = commits.map(({ commit, author }) => `- ${commit} by ${author}`).join("\n");
            const body = `⚠️ Some commits in this PR are missing a "Signed-off-by" line.\nUnsigned commits:\n${details}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });