name: Remove label that triggered the CI

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string

env:
  EXPECTED_LABEL: run_tests

jobs:
  remove_label:
    if: ${{ inputs.label == $EXPECTED_LABEL }}

    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Remove run_tests label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: $EXPECTED_LABEL
